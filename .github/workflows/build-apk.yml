name: Build APKs

# Builds installable APKs for the four apps (retail POS, ticket redemption,
# SMS forward, NFC card emulator) on a GitHub-hosted runner, which has the
# Android SDK and network access that a local sandbox may lack.
#
# Every run uploads the APKs as a downloadable artifact. Pushing a tag such as
# v1.0.0 additionally publishes them as assets on a GitHub Release.
#
# Targets Android 16 (API 36); a targetSdk 36 APK also runs on Android 17.

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach APKs to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest

    # Optional release signing. Set these repository secrets to sign the
    # release APKs with your own key; without them, release APKs fall back to
    # the debug key (still installable) per each module's build.gradle.kts.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 36 + build-tools)
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default packages ("tools platform-tools"):
          # the legacy `tools` package was removed from Google's repository and
          # makes the default install fail. Install only current, valid packages.
          # build-tools 35.0.0 covers AGP 8.9.1's default; 36.0.0 matches API 36.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (only if secrets are set)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured from repository secrets."

      - name: Build debug + release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :pos-app:assembleDebug :pos-app:assembleRelease \
            :ticket-app:assembleDebug :ticket-app:assembleRelease \
            :sms-forward-app:assembleDebug :sms-forward-app:assembleRelease \
            :nfc-card-app:assembleDebug :nfc-card-app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find pos-app ticket-app sms-forward-app nfc-card-app \
            -path '*/build/outputs/apk/*' -name '*.apk' -exec cp -v {} artifacts/ \;
          echo "## Built APKs" >> "$GITHUB_STEP_SUMMARY"
          ( cd artifacts && for f in *.apk; do \
            echo "- \`$f\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"; done )

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: printerclient-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
